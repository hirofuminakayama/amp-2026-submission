schema_version: 1
seed: 42
output_dir: generate
runtime:
  device: cuda
  strict_determinism: true
  cpu_threads: 8
generation:
  sampler: official
  raw_pool_size: 60000
  library_size: 50000
  batch_size: 128
  checkpoint: checkpoint/model.pt
  length_policy: empirical_tempered
  min_generation_length: 10
  max_generation_length: 40
  length_temperature: 0.75
references:
  challenge_fasta: data/antibacterial.fasta
  known_amp_fasta: data/training/training.fasta
ranking:
  official_challenge_similarity_max: 0.80
  selection_challenge_similarity_max: 0.78
  known_local_similarity_max: 0.60
  pairwise_local_similarity_max: 0.50
  adopted_ranker: B1
  prefilter_sizes: [5000, 10000]
  max_per_embedding_cluster: 5
  fallback_cluster_cap: 8
  fallback_pairwise_local_similarity_max: 0.55
features:
  physicochemical:
    schema_version: 1
    dtype: float64
    feature_order:
      - length
      - charge_ph_7_4
      - charge_density
      - gravy
      - hydrophobic_moment
      - aromaticity
      - boman_index
      - isoelectric_point
      - molecular_weight
      - shannon_entropy
      - longest_homopolymer
      - max_aa_fraction
      - cysteine_count
    epsilon: 0.000001
    robust_z_clip: 10.0
    hard_reject_extreme_feature_count: 3
    hard_reject_low_entropy_quantile: 0.005
    soft_penalty_features:
      - charge_density
      - gravy
      - hydrophobic_moment
      - cysteine_count
  embeddings:
    model_name: esm2_t6_8M_UR50D
    model_revision: fair-esm-2.0.0
    dtype: float32
    embedding_dimension: 320
    batch_size: 512
    pca_components: 64
    pca_reference_subset: 10000
    knn_neighbors: 5
    cluster_count: 512
    seed: 42
    thread_count: 1
apex:
  model_count: 8
  pathogen_count: 11
  device: cpu
  batch_size: 3000
  cpu_threads: 8
  mic_activity_threshold_uM: 16.0
  tensor_dtype: float32
calibration:
  seed: 42
  folds: 5
  bootstrap_iterations: 1000
  activity_threshold_uM: 16.0
library_selection:
  enabled: true
  adopted_variant: L2
  fallback: L0_first_valid
  minimum_full_pool_size: 50000
