schema_version: 1
seed: 42
output_dir: generate
runtime:
  device: cuda
  strict_determinism: true
  cpu_threads: 8
generation:
  sampler: official
  raw_pool_size: 50000
  library_size: 50000
  batch_size: 256
  checkpoint: checkpoint/model.pt
  length_policy: uniform
  min_generation_length: 10
  max_generation_length: 40
  length_temperature: 1.0
references:
  challenge_fasta: data/antibacterial.fasta
  known_amp_fasta: data/training/training.fasta
ranking:
  official_challenge_similarity_max: 0.80
  selection_challenge_similarity_max: 0.80
  known_local_similarity_max: 0.60
  pairwise_local_similarity_max: 0.40
